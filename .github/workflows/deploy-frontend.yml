name: Deploy frontend

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main]
    paths: ['client/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/vppsport-frontend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/vppsport-frontend:latest

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -n vppsports-frontend -g vppsports \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/vppsport-frontend:${{ github.sha }} \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }}
          az containerapp update -n vppsports-frontend -g vppsports \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/vppsport-frontend:${{ github.sha }}
